[project]
name = "ayo-copilot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "gszeliga", email = "gszeliga@protonmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.148.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
ayo-copilot = "ayo_copilot:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not live'"
markers = [
    "integration: needs a Postgres database with pgvector (testcontainers or TEST_DATABASE_URL)",
    "live: calls the real embedding provider; never runs by default",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
